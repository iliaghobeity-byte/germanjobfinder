    <meta property="og:description" content="Smart job matchmaker, Opportunity Card calculator, German CV generator and immigration roadmap with Gemini AI." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('germany_job_finder_dark_mode');
          if (saved === 'true' || (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
